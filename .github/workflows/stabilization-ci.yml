name: JuHelo Frontend Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          node --check app-v31.js
          node --check boot.js
          node --check form-ux.js
          node --check picker.js
          node --check supabase-proxy-v33.js

      - name: Ensure canonical active styles only
        run: |
          grep -q 'design-system.css?v=uiux12' index.html
          grep -q 'app-shell.css?v=uiux12' index.html
          grep -q 'app-ui.css?v=uiux12' index.html
          grep -q 'forms.css?v=uiux12' index.html
          grep -q 'picker.css?v=uiux12' index.html
          grep -q 'interactions.css?v=uiux12' index.html
          ! grep -q 'app-v31.css' index.html
          ! grep -qE 'modal-ux-v|picker-v[0-9]|styles-v|reference-v|home-v|transactions-v|boxes-v|goals-v|stability-v' index.html

      - name: Ensure one renderer and no redesign observers
        run: |
          grep -q "app-v31.js?v=uiux12" boot.js
          ! grep -q 'MutationObserver' app-v31.js
          ! grep -q 'MutationObserver' boot.js
          ! grep -q 'MutationObserver' form-ux.js
          ! grep -q 'MutationObserver' picker.js
          test "$(grep -o 'createClient(' app-v31.js | wc -l)" -eq 1

      - name: Ensure canonical form and picker behavior
        run: |
          grep -q 'data-currency-mask' form-ux.js
          grep -q 'jh-select-popover' picker.js
          grep -q 'aria-haspopup' picker.js
          grep -q 'data-native-disabled' picker.js
          grep -q 'pointer-events:none!important' picker.css
          grep -q 'font-size:16px' forms.css
          ! grep -q 'gesturestart' picker.js

      - name: Ensure animated inline navigation
        run: |
          grep -q 'jh-nav-pill-enter' app-shell.css
          grep -q 'nav-item.active>span:last-child' app-shell.css
          grep -q 'width:108px' app-shell.css

      - name: Check PWA final asset graph
        run: |
          grep -q "juhelo-uiux-12" sw.js
          grep -q "design-system.css?v=uiux12" sw.js
          grep -q "app-shell.css?v=uiux12" sw.js
          grep -q "app-ui.css?v=uiux12" sw.js
          grep -q "forms.css?v=uiux12" sw.js
          grep -q "picker.css?v=uiux12" sw.js
          grep -q "interactions.css?v=uiux12" sw.js
          grep -q "form-ux.js?v=uiux12" sw.js
          grep -q "picker.js?v=uiux12" sw.js
          grep -q "boot.js?v=uiux12" sw.js
          ! grep -q 'app-v31.css' sw.js

      - name: Check build marker
        run: |
          grep -q 'juhelo-build" content="uiux-12' index.html
          grep -q 'data-juhelo-build="uiux-12"' index.html
