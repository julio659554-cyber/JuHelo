name: JuHelo Frontend Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check boot.js
          node --check form-ux.js
          node --check picker.js
          node --check motion.js
          node --check supabase-proxy-v33.js

      - name: Ensure canonical active styles only
        run: |
          grep -q 'design-system.css?v=uiux22' index.html
          grep -q 'app-shell.css?v=uiux22' index.html
          grep -q 'app-ui.css?v=uiux22' index.html
          grep -q 'forms.css?v=uiux22' index.html
          grep -q 'categories.css?v=uiux22' index.html
          grep -q 'picker.css?v=uiux22' index.html
          grep -q 'interactions.css?v=uiux22' index.html
          if grep -q 'app-v31.css' index.html; then exit 1; fi
          if grep -qE 'modal-ux-v|picker-v[0-9]|styles-v|reference-v|home-v|transactions-v|boxes-v|goals-v|stability-v' index.html; then exit 1; fi

      - name: Ensure one renderer and no redesign observers
        run: |
          grep -q "app.js?v=uiux22" boot.js
          if grep -q 'app-v31.js' boot.js; then exit 1; fi
          if grep -q 'MutationObserver' app.js; then exit 1; fi
          if grep -q 'MutationObserver' boot.js; then exit 1; fi
          if grep -q 'MutationObserver' form-ux.js; then exit 1; fi
          if grep -q 'MutationObserver' picker.js; then exit 1; fi
          if grep -q 'MutationObserver' motion.js; then exit 1; fi
          test "$(grep -o 'createClient(' app.js | wc -l)" -eq 1
          test "$(grep -o "serviceWorker.register" boot.js | wc -l)" -eq 1
          if grep -q "serviceWorker.register" app.js; then exit 1; fi

      - name: Ensure payment status and recurring deletion wiring
        run: |
          grep -q "rpc('set_transaction_paid'" app.js
          grep -q "p_transaction_id:tx.id,p_paid:next" app.js
          grep -q "data-toggle-paid" app.js
          grep -q "isPayable(tx)" app.js
          grep -q "tx.kind!=='box_contribution'" app.js
          grep -q "payment-badge" app.js
          grep -q "payment-check" app-ui.css
          grep -q "width:44px" app-ui.css
          grep -q "loadPreviousPending" app.js
          grep -q ".eq('month',previousMonth())" app.js
          grep -q ".eq('direction','expense')" app.js
          grep -q ".eq('is_paid',false)" app.js
          grep -q "data-previous-pending" app.js
          grep -q "data-clear-unpaid" app.js
          grep -q "rpc('delete_recurring_expense'" app.js
          grep -q "p_scope:scope" app.js
          grep -q "data-delete-recurring-scope=\"this_month\"" app.js
          grep -q "data-delete-recurring-scope=\"future\"" app.js
          grep -q "data-delete-recurring-scope=\"all\"" app.js
          grep -q "recurring-delete-options>button.destructive" forms.css
          if grep -q "line-through" app-ui.css; then exit 1; fi

      - name: Ensure canonical categories and card wiring
        run: |
          grep -q 'const CATEGORIES=Object.freeze' app.js
          grep -q "market:{label:'Mercado'" app.js
          grep -q "installments:{label:'Parcelamentos grandes'" app.js
          grep -q "debit_pix:{label:'Compras no débito / Pix'" app.js
          grep -q "uncategorized:{label:'Sem categoria',emoji:'❔'" app.js
          grep -q 'loadCards' app.js
          grep -q "from('payment_cards')" app.js
          grep -q 'card_id' app.js
          grep -q 'cardBreakdown' app.js
          grep -q 'Gastos por cartão' app.js
          grep -q 'data-cards-form' app.js
          grep -q 'data-card-purpose' app.js
          grep -q 'CARD_PURPOSE_CATEGORIES' app.js
          grep -q 'categoryBreakdown' app.js
          grep -q 'categoryBarsSvg' app.js
          grep -q "neq('kind','box_contribution')" app.js
          grep -q "data-preset=\"month\"" app.js
          if grep -q "REPORT_CATEGORIES=.*'box'" app.js; then exit 1; fi
          grep -q 'grid-template-columns:repeat(2,minmax(0,1fr))' categories.css
          grep -q '.category-choice.is-wide{grid-column:auto}' categories.css
          grep -q '.card-select-field{display:none!important}' categories.css
          grep -q '\[data-expense-details\]\[hidden\]{display:none!important}' categories.css
          grep -q ".tx-icon.income::before{content:'💰'" categories.css
          if grep -q 'quick-card.income>span::before' categories.css; then exit 1; fi
          if grep -q 'mini-grid article.income>span::before' categories.css; then exit 1; fi
          grep -q 'card-setting' categories.css
          grep -q '.chart-wrap{width:100%;overflow:hidden' categories.css
          grep -q '.chart-wrap svg{display:block;width:100%;max-width:100%;min-width:0' categories.css

      - name: Ensure settings horizontal tabs
        run: |
          grep -q '.settings-tabs{' forms.css
          grep -q 'display:flex;' forms.css
          grep -q 'overflow-x:auto;' forms.css
          grep -q 'white-space:nowrap;' forms.css
          grep -q 'scroll-snap-type:x proximity;' forms.css

      - name: Ensure canonical form and picker behavior
        run: |
          grep -q 'data-currency-mask' form-ux.js
          grep -q 'openFullTransactions' form-ux.js
          grep -q 'Ver todas despesas' form-ux.js
          grep -q 'Ver todas receitas' form-ux.js
          grep -q 'jh-select-popover' picker.js
          grep -q 'aria-haspopup' picker.js
          grep -q 'data-native-disabled' picker.js
          grep -q 'pointer-events:none!important' picker.css
          grep -q 'bottom:27px' picker.css
          grep -q 'border-right:2px solid currentColor' picker.css
          grep -q 'font-size:16px' forms.css
          if grep -q 'gesturestart' picker.js; then exit 1; fi

      - name: Ensure home see-all affordances
        run: |
          grep -q "content:'Ver todas despesas'" interactions.css
          grep -q "content:'Ver todas receitas'" interactions.css
          grep -q '.extract-grid .list-card{scroll-margin-top:18px}' interactions.css

      - name: Ensure stable settings motion system
        run: |
          grep -q 'motion.js?v=uiux22' index.html
          grep -q 'animateNewPage' motion.js
          grep -q 'animateHeight' motion.js
          grep -q 'stabilizeSettings' motion.js
          grep -q 'content.scrollTop = 0' motion.js
          grep -q 'settings-tab-indicator' motion.js
          if grep -q 'animateHeight(measure.panel' motion.js; then exit 1; fi
          grep -q 'jh-sheet-in' interactions.css
          grep -q 'segmented:has' interactions.css
          grep -q '.settings-panel{' interactions.css
          grep -q 'overflow:hidden!important' interactions.css
          grep -q '.settings-content{' interactions.css
          grep -q 'contain:layout paint' interactions.css
          grep -q 'data-ssection="security"' interactions.css

      - name: Ensure animated inline navigation
        run: |
          grep -q 'jh-nav-pill-enter' app-shell.css
          grep -q 'nav-item.active>span:last-child' app-shell.css
          grep -q 'width:108px' app-shell.css

      - name: Check PWA final asset graph
        run: |
          grep -q "juhelo-uiux-22" sw.js
          grep -q "design-system.css?v=uiux22" sw.js
          grep -q "app-shell.css?v=uiux22" sw.js
          grep -q "app-ui.css?v=uiux22" sw.js
          grep -q "forms.css?v=uiux22" sw.js
          grep -q "categories.css?v=uiux22" sw.js
          grep -q "picker.css?v=uiux22" sw.js
          grep -q "interactions.css?v=uiux22" sw.js
          grep -q "app.js?v=uiux22" sw.js
          grep -q "form-ux.js?v=uiux22" sw.js
          grep -q "picker.js?v=uiux22" sw.js
          grep -q "motion.js?v=uiux22" sw.js
          grep -q "boot.js?v=uiux22" sw.js
          if grep -q 'app-v31.js' sw.js; then exit 1; fi
          if grep -q 'app-v31.css' sw.js; then exit 1; fi

      - name: Check build marker
        run: |
          grep -q 'juhelo-build" content="uiux-22' index.html
          grep -q 'data-juhelo-build="uiux-22"' index.html
