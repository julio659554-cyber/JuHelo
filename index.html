<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f8f7fa" />
  <meta name="color-scheme" content="light dark" />
  <meta name="description" content="JuHelo — finanças do casal" />
  <meta name="juhelo-build" content="uiux-01" />
  <script>
    (()=>{
      const saved=localStorage.getItem('juhelo-theme-preference');
      const pref=['light','dark','system'].includes(saved)?saved:'light';
      const dark=pref==='dark'||(pref==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme=dark?'dark':'light';
      document.documentElement.dataset.themePreference=pref;
      document.documentElement.style.colorScheme=dark?'dark':'light';
      document.querySelector('meta[name="theme-color"]')?.setAttribute('content',dark?'#0e0c12':'#f8f7fa');
    })();
  </script>
  <script type="importmap">
    {"imports":{"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm":"./supabase-proxy-v33.js?v=40"}}
  </script>
  <link rel="manifest" href="./manifest.webmanifest?v=uiux1" />
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml" />
  <title>JuHelo</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="preconnect" href="https://unpkg.com" crossorigin />
  <link rel="stylesheet" href="./app-v31.css?v=40" />
  <link rel="stylesheet" href="./design-system.css?v=uiux1" />
  <link rel="stylesheet" href="./modal-ux-v36.css?v=40" />
  <link rel="stylesheet" href="./picker-v40.css?v=40" />
  <style>
    :root{--skel-1:var(--jh-skeleton-base);--skel-2:var(--jh-skeleton-highlight);--boot-bg:var(--jh-bg)}
    .splash{min-height:100dvh!important;width:100%!important;background:var(--boot-bg)!important;padding:0!important;display:block!important}
    .splash .brand-name,.splash .brand-mark,.splash>p{display:none!important}
    .jh-boot-skeleton{position:relative;min-height:100dvh;padding:84px 22px 126px;box-sizing:border-box;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:max-content;gap:16px 14px;align-content:start}
    .jh-skel{background:linear-gradient(100deg,var(--skel-1) 30%,var(--skel-2) 48%,var(--skel-1) 66%);background-size:240% 100%;animation:jhShimmer 1.5s ease-in-out infinite;border-radius:var(--jh-radius-lg)}
    .jh-skel-title{width:118px;height:34px;grid-column:1;border-radius:var(--jh-radius-sm)}
    .jh-skel-avatar{width:66px;height:66px;border-radius:var(--jh-radius-lg);justify-self:end;grid-column:2;grid-row:1}
    .jh-skel-main{height:245px;grid-column:1/-1;margin-top:22px;border-radius:var(--jh-radius-2xl)}
    .jh-skel-row{display:contents}.jh-skel-half{height:116px;border-radius:var(--jh-radius-xl)}
    .jh-skel-nav{position:fixed;left:22px;right:22px;bottom:calc(22px + env(safe-area-inset-bottom));height:88px;border-radius:var(--jh-radius-2xl)}
    .jh-boot-failed{min-height:100dvh;box-sizing:border-box;padding:32px;display:grid;place-content:center;text-align:center;justify-items:center;color:var(--jh-text);gap:18px}
    .jh-boot-failed-icon{width:88px;height:88px;border-radius:var(--jh-radius-xl);background:var(--jh-accent-soft);color:var(--jh-accent);display:grid;place-items:center;font-size:48px;line-height:1}
    .jh-boot-failed strong{font-size:28px;line-height:1.15;max-width:330px}
    .jh-boot-failed p{margin:0;color:var(--jh-muted);font-size:18px;line-height:1.45;max-width:320px}
    .jh-boot-failed button{margin-top:8px;border:0;border-radius:var(--jh-radius-lg);background:var(--jh-accent);color:#fff;font-size:18px;font-weight:800;padding:18px 28px;min-width:230px}
    @keyframes jhShimmer{0%{background-position:100% 0}100%{background-position:-100% 0}}
    @media(max-width:420px){.jh-boot-skeleton{padding:78px 18px 118px;gap:14px 12px}.jh-skel-main{height:230px}.jh-skel-half{height:108px}.jh-skel-nav{left:18px;right:18px;height:82px}}
    @media(prefers-reduced-motion:reduce){.jh-skel{animation:none}}
  </style>
</head>
<body data-juhelo-build="uiux-01">
  <div id="app" class="app-shell"><div class="splash" aria-label="Carregando JuHelo"></div></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <script src="./modal-ux-v36.js?v=40" defer></script>
  <script src="./picker-v40.js?v=40" defer></script>
  <script src="./boot-v40.js?v=40" defer></script>
</body>
</html>
