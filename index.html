<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f8f7fb" />
  <meta name="color-scheme" content="light dark" />
  <meta name="description" content="JuHelo — finanças do casal" />
  <meta name="juhelo-build" content="v32" />
  <script>
    (()=>{
      const saved=localStorage.getItem('juhelo-theme-preference');
      const pref=['light','dark','system'].includes(saved)?saved:'light';
      const dark=pref==='dark'||(pref==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme=dark?'dark':'light';
      document.documentElement.dataset.themePreference=pref;
      document.documentElement.style.colorScheme=dark?'dark':'light';
      document.querySelector('meta[name="theme-color"]')?.setAttribute('content',dark?'#0f0d14':'#f8f7fb');
    })();
  </script>
  <script type="importmap">
    {
      "imports": {
        "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm": "https://esm.sh/@supabase/supabase-js@2.45.4?bundle"
      }
    }
  </script>
  <link rel="manifest" href="./manifest.webmanifest?v=32" />
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml" />
  <title>JuHelo</title>
  <link rel="preconnect" href="https://esm.sh" crossorigin />
  <link rel="stylesheet" href="./app-v31.css?v=32" />
  <style>
    :root{--skel-1:#ece9f1;--skel-2:#f7f5fa;--boot-bg:#f8f7fb}
    html[data-theme="dark"]{--skel-1:#1c1824;--skel-2:#272131;--boot-bg:#0f0d14}
    .splash{
      min-height:100dvh!important;
      width:100%!important;
      display:block!important;
      padding:0!important;
      background:var(--boot-bg)!important;
      color:inherit!important;
    }
    .splash .brand-name,.splash>p,.splash>.brand-mark{display:none!important}
    .jh-boot-skeleton{
      min-height:100dvh;
      padding:calc(env(safe-area-inset-top,0px) + 58px) 22px calc(env(safe-area-inset-bottom,0px) + 36px);
      display:flex;
      flex-direction:column;
      gap:18px;
      box-sizing:border-box;
    }
    .jh-skel{
      border-radius:24px;
      background:linear-gradient(100deg,var(--skel-1) 20%,var(--skel-2) 42%,var(--skel-1) 64%);
      background-size:240% 100%;
      animation:jhSkel 1.35s ease-in-out infinite;
    }
    .jh-skel-title{width:112px;height:30px;border-radius:12px;margin-top:14px}
    .jh-skel-avatar{position:absolute;top:calc(env(safe-area-inset-top,0px) + 70px);right:24px;width:64px;height:64px;border-radius:22px}
    .jh-skel-main{width:100%;height:238px;border-radius:30px;margin-top:34px}
    .jh-skel-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .jh-skel-half{height:112px;border-radius:26px}
    .jh-skel-nav{height:84px;border-radius:28px;margin-top:auto}
    .jh-boot-failed{
      min-height:100dvh;
      padding:32px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      box-sizing:border-box;
    }
    .jh-boot-failed-icon{width:58px;height:58px;border-radius:20px;display:grid;place-items:center;background:#2c2140;color:#aa75ff;font-size:30px;margin-bottom:18px}
    .jh-boot-failed strong{font-size:22px;margin-bottom:8px}
    .jh-boot-failed p{margin:0 0 22px;opacity:.68;max-width:280px;line-height:1.45}
    .jh-boot-failed button{min-width:190px;min-height:52px;border:0;border-radius:18px;background:#7c3aed;color:#fff;font:inherit;font-weight:800;padding:0 22px}
    @keyframes jhSkel{0%{background-position:100% 0}100%{background-position:-120% 0}}
    @media(max-width:420px){
      .jh-boot-skeleton{padding-left:18px;padding-right:18px;gap:14px}
      .jh-skel-main{height:218px;border-radius:26px}
      .jh-skel-half{height:104px;border-radius:22px}
      .jh-skel-nav{height:78px;border-radius:26px}
    }
    @media(prefers-reduced-motion:reduce){.jh-skel{animation:none}}
  </style>
</head>
<body data-juhelo-build="v32">
  <div id="app" class="app-shell">
    <div class="splash" aria-label="Carregando JuHelo">
      <div class="jh-boot-skeleton" aria-hidden="true">
        <div class="jh-skel jh-skel-title"></div>
        <div class="jh-skel jh-skel-avatar"></div>
        <div class="jh-skel jh-skel-main"></div>
        <div class="jh-skel-row"><div class="jh-skel jh-skel-half"></div><div class="jh-skel jh-skel-half"></div></div>
        <div class="jh-skel-row"><div class="jh-skel jh-skel-half"></div><div class="jh-skel jh-skel-half"></div></div>
        <div class="jh-skel jh-skel-nav"></div>
      </div>
    </div>
  </div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <script src="./boot-v32.js?v=32"></script>
  <script type="module" src="./app-v31.js?v=32"></script>
</body>
</html>
